<style>
  /* The tour's own furniture, and nothing of the app's. */
  html, body { overflow: hidden; width: 1320px; height: 860px; }
  #screen { position: absolute; inset: 0; }
  #overlay { position: fixed; inset: 0; pointer-events: none; z-index: 2147483000; }
  .tour-ring {
    position: absolute; border-radius: 10px;
    border: 2px solid rgb(var(--brand-400));
    box-shadow: 0 0 0 4px rgb(var(--brand-400) / .22);
    transition: left .35s, top .35s, width .35s, height .35s;
  }
  .tour-ring.is-dim { box-shadow: 0 0 0 4px rgb(var(--brand-400) / .22), 0 0 0 200vmax rgb(0 0 0 / .42); }
  .tour-ring.is-pulse::after {
    content: ""; position: absolute; inset: -2px; border-radius: inherit;
    border: 2px solid rgb(var(--brand-400)); animation: tour-pulse 1.6s ease-out infinite;
  }
  @keyframes tour-pulse { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { .tour-ring.is-pulse::after { animation: none; } .tour-ring { transition: none; } }
  /* Nothing in a picture of a control should look draggable or selectable by accident. */
  #screen * { cursor: default; }
  #screen button, #screen a, #screen [role=button], #screen [role=tab] { cursor: pointer; }
  #screen input, #screen textarea { cursor: text; }
