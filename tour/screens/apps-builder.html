@layer slate {
  :root {
    --n-50: 244 246 250; --n-100: 233 235 239; --n-200: 213 216 224; --n-300: 171 177 190;
    --n-400: 127 132 145; --n-500: 88 93 105; --n-600: 62 66 77; --n-700: 43 47 57;
    --n-800: 28 31 39; --n-900: 18 21 27; --n-950: 10 12 16;
    --brand-400: 122 170 254; --brand-500: 80 144 255; --brand-600: 58 119 225;
    --leaf-red-500: 254 100 85; --leaf-amber-500: 254 178 6; --leaf-green-500: 49 177 124;
    --leaf-teal-500: 40 176 151; --leaf-blue-500: 57 119 228;

    --bg: rgb(var(--n-50));
    --surface: #fff;
    --text: rgb(var(--n-900));
    --muted: rgb(var(--n-500));
    --border: rgb(var(--n-900) / 0.08);
    --hover: rgb(var(--n-900) / 0.04);
    --accent: rgb(var(--brand-600));
    --accent-text: #fff;
    --c1: rgb(var(--leaf-blue-500)); --c2: rgb(var(--leaf-teal-500));
    --c3: rgb(var(--leaf-green-500)); --c4: rgb(var(--leaf-amber-500));
    --c5: rgb(var(--leaf-red-500));
    --radius: 10px;
    --font: &amp;quot;Geist Variable&amp;quot;, &amp;quot;Geist&amp;quot;, -apple-system, BlinkMacSystemFont, &amp;quot;Segoe UI&amp;quot;, sans-serif;
    --mono: &amp;quot;Geist Mono Variable&amp;quot;, &amp;quot;Geist Mono&amp;quot;, ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: light;
  }
  :root[data-theme=&amp;quot;dark&amp;quot;] {
    --bg: rgb(var(--n-950));
    --surface: rgb(var(--n-900));
    --text: rgb(var(--n-100));
    --muted: rgb(var(--n-400));
    --border: rgb(var(--n-50) / 0.07);
    --hover: rgb(var(--n-50) / 0.05);
    --accent: rgb(var(--brand-500));
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg: rgb(var(--n-950)); --surface: rgb(var(--n-900)); --text: rgb(var(--n-100));
      --muted: rgb(var(--n-400)); --border: rgb(var(--n-50) / 0.07);
      --hover: rgb(var(--n-50) / 0.05); --accent: rgb(var(--brand-500)); color-scheme: dark;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; padding: 32px clamp(16px, 4vw, 48px);
    background: var(--bg); color: var(--text);
    font: 14px/1.6 var(--font); -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { margin: 1.4em 0 0.5em; line-height: 1.25; letter-spacing: -0.01em; }
  h1 { font-size: 26px; font-weight: 650; margin-top: 0; }
  h2 { font-size: 19px; font-weight: 600; }
  h3 { font-size: 15px; font-weight: 600; }
  h4 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  p, ul, ol { margin: 0 0 0.9em; }
  small, .muted { color: var(--muted); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }
  img, svg, canvas, video { max-width: 100%; }

  code, kbd, samp { font-family: var(--mono); font-size: 0.9em; }
  :not(pre) &amp;gt; code { background: var(--hover); border: 1px solid var(--border); border-radius: 5px; padding: 0.1em 0.35em; }
  pre {
    font-family: var(--mono); font-size: 12.5px; line-height: 1.55; overflow: auto;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 0 0 1em; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  tbody tr:hover { background: var(--hover); }

  button, input, select, textarea { font: inherit; color: inherit; }
  button {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 6px 12px; border-radius: 8px; border: 1px solid transparent;
    background: var(--accent); color: var(--accent-text); font-weight: 550; font-size: 13px;
    transition: filter 0.15s, background 0.15s;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary, button[data-variant=&amp;quot;secondary&amp;quot;] { background: transparent; color: var(--text); border-color: var(--border); }
  button.secondary:hover, button[data-variant=&amp;quot;secondary&amp;quot;]:hover { background: var(--hover); filter: none; }
  input:not([type=&amp;quot;checkbox&amp;quot;]):not([type=&amp;quot;radio&amp;quot;]):not([type=&amp;quot;range&amp;quot;]), select, textarea {
    padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); font-size: 13px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgb(var(--brand-500) / 0.2); }
  input[type=&amp;quot;checkbox&amp;quot;], input[type=&amp;quot;radio&amp;quot;], input[type=&amp;quot;range&amp;quot;] { accent-color: var(--accent); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .card &amp;gt; :first-child, .stack &amp;gt; :first-child { margin-top: 0; }
  .card &amp;gt; :last-child { margin-bottom: 0; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px;
    font-size: 11.5px; font-weight: 550; background: rgb(var(--brand-500) / 0.1); color: var(--accent);
  }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
}
