  <!-- The lockup: mark stacked over the wordmark, on transparency. This is the
       signature for a surface with room for it — the website hero, the
       slate-releases landing page, a README. Anywhere square or small takes
       icon.svg (tile) or mark.svg (bare); the word does not survive there.
       The gap between mark and word is the designed relationship — move one
       and you have redrawn the logo, so move neither.
       The wordmark is #2F3441 and vanishes on a dark background; over dark,
       use mark.svg beside live text you can colour. -->
