<svg xmlns="http://www.w3.org/2000/svg" width="362" height="430" viewBox="0 0 362 430" fill="none">
  <!-- THE mark, alone and on transparency: four stacked leaves of a slate.
       No wordmark — this is the form that has to survive at 16px. The lockup
       (mark + "Slate") is logo.svg; the app-icon tile is icon.svg.
       Paths are the traced outlines; they are never rewritten, only translated
       by the wrapping <g>, because the wordmark carries Q curves that a
       naive coordinate rewrite silently mangles. -->
